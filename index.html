<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduControl | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">EC</div>
    <p class="eyebrow">EDUCONTROL</p>
    <h1>Bem-vindo de volta</h1>
    <p class="muted">Entre para gerenciar os alunos da instituição.</p>
    <form id="loginForm">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" placeholder="Digite qualquer usuário" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Digite qualquer senha" required>
      <button class="btn primary full" type="submit">Entrar no sistema</button>
    </form>
    <p class="hint">Demonstração escolar: qualquer usuário e senha preenchidos permitem entrar.</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
